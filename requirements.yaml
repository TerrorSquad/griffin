---
collections:
  # Floor is 11.0.0, not 1.0.0: the 8.x homebrew module guards `brew info
  # --json=v2` on stderr rather than the return code, so any Homebrew warning
  # left stdout empty and crashed the install task with a JSONDecodeError.
  # 10.x dropped that code path.
  #
  # Ceiling is 12.0.0 because Ubuntu 24.04 ships ansible-core 2.16, and
  # community.general 12.x requires >=2.17 (13.x requires >=2.18). The WSL job
  # installs ansible from apt, so a higher floor is unsatisfiable there.
  - name: community.general
    version: ">=11.0.0,<12.0.0"
