---
name: macOS
on:
  pull_request:
    branches:
      - master
    paths:
      - "post-installation/**/*"
      - ".github/workflows/macos.yaml"
      - "requirements.yaml"
  schedule:
    - cron: "0 0 * * 1" # Every Monday at 00:00

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ansible:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The config most users actually get: CLI + shell, no flags.
          - name: default
            flags: ""
          # Every code path worth exercising, minus GUI apps and SDKs.
          - name: ci
            flags: "-e ci=true"
    name: ansible (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          brew install ansible

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install -r requirements.yaml

      - name: Run ansible playbook
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ${{ github.workspace }}
          ansible-playbook ./playbook_macos.yaml ${{ matrix.flags }} -e github_token=$GITHUB_TOKEN
