---
username: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
dev_tools_gui: false
gui: false
golang: false
rust: false
docker: false
ddev: false
gestures: false
fonts: false
vpn: false
mobile: false
# Wipe ~/.vim/plugged before installing plugins. Off: a re-run must not destroy
# a working plugin set. Turn on for a clean reinstall.
nvim_reset: false
# Prune developer tool caches (brew, npm, go, docker, ...). Off, and excluded
# from `all`: provisioning must not delete data as a side effect. Opt in with
# `-e prune_caches=true` or `--tags prune`.
prune_caches: false
kde: true
all: false
remove_snap: true

# System directories (OS-agnostic)
systemd_system: "/etc/systemd/system/"
sysfs: "/etc/sysfs.conf"
snap_bin_path: "/snap/bin"
keyrings_dir: "/etc/apt/keyrings"

# Download directory
download_dir: "/tmp/ansible"

# System files
docker_compose: "/usr/local/bin/docker-compose"

# Flameshot: installed from the upstream DMG rather than Homebrew, whose cask is
# disabled 2026-09-01 for failing Gatekeeper. Bump both versions together — the
# git tag carries the patch level, the DMG filename does not.
flameshot_version: "14.0.0"
flameshot_bundle_version: "14.0.0"
flameshot_dmg: "Flameshot-14.0-macos-{{ 'arm64' if ansible_architecture == 'arm64' else 'intel' }}.dmg"
flameshot_dmg_url: "https://github.com/flameshot-org/flameshot/releases/download/v{{ flameshot_version }}/{{ flameshot_dmg }}"
flameshot_mount: "/Volumes/Flameshot"

# Claude Code settings keys the playbook deletes outright. A key merely absent
# from the template survives the merge, so removals have to be explicit.
claude_purged_settings_keys:
  - hooks

# Canonical tool sets (WP1: Baseline Refactor - single source of truth)
tool_sets:
  # Minimal system prerequisites (apt only - required for Homebrew bootstrap)
  system_prerequisites:
    - build-essential
    - curl
    - git
    - gpg
    - python3-pip
    - procps
    - file
    - unzip
    - zip

  # All CLI tools via Homebrew (both Debian and macOS)
  modern_cli_homebrew:
    - agg
    - ansible
    - ansible-lint
    - asciinema
    - atuin
    - bandwhich
    - bat
    - btop
    - dos2unix
    - duf
    - dust
    - eza
    - fd
    - fzf
    - gemini-cli
    - gh
    - git-delta
    - git-filter-repo
    - gping
    - gum
    - htmlq
    - htop
    - httpie
    - hyperfine
    - jq
    - lazydocker
    - lazygit
    - lnav
    - make
    - mise
    - nano
    - ncdu
    - pandoc
    - pipx
    - qrencode
    - ripgrep
    - sd
    - shellcheck
    - terrorsquad/tap/forge-git
    - tree
    - unzip
    - uv
    - vim
    - wget
    - yamlfmt
    - yazi
    - yq
    - zip
    - zoxide

  # Opt-in only: installed with `-e all=true`. Zero recorded uses in 21k
  # shell-history commands, and no alias/keybinding/git-config path.
  modern_cli_homebrew_optional:
    - age
    - bottom
    - broot
    - cheat
    - croc
    - curlie
    - difftastic
    - doggo
    - entr
    - exiftool
    - fastfetch
    - flyctl
    - fx
    - git-quick-stats
    - glow
    - grex
    - gron
    - helix
    - httpstat
    - jless
    - lsd
    - lynx
    - mdbook
    - mdcat
    - miller
    - mkcert
    - navi
    - nmap
    - oha
    - peco
    - procs
    - rbenv
    - tealdeer
    - thefuck
    - tokei
    - viddy
    - visidata
    - webp
    - xh
    - zellij

  # GNU userland replacements - macOS only (Linux ships these natively)
  cli_macos:
    - gawk
    - gnu-sed
    - gnu-tar
    - mas
    - proctools

  # Python CLI tools with no Homebrew formula - installed via `uv tool install`
  uv_tools:
    - claude-swap

  # Mac App Store apps - no Homebrew cask exists for these
  # IDs from: mdls -name kMDItemAppStoreAdamID /Applications/<App>.app
  mas_apps:
    - {id: 937984704, name: Amphetamine}
    - {id: 1287239339, name: ColorSlurp}
    - {id: 446243721, name: Disk Inspector}

  # Xcode is a ~10GB download - only with the mobile toolchain
  mas_apps_mobile:
    - {id: 497799835, name: Xcode}

  # GUI development tools (macOS)
  gui_dev_macos:
    - dbeaver-community
    - claude-code
    # replaces alacritty + wezterm + iterm2: GPU-accelerated like alacritty,
    # native, and has a built-in quick terminal (the iTerm dropdown)
    - ghostty
    - zed

  # CocoaPods is required for Flutter/React Native iOS builds
  cli_mobile_macos:
    - cocoapods

  # Mobile toolchain (~15GB with Xcode) - opt in with `-e mobile=true` or `--tags mobile`
  gui_mobile_macos:
    - android-commandlinetools
    - android-platform-tools
    - android-studio
    - flutter

  # Opt-in only: installed with `-e all=true`. Not used day-to-day.
  gui_dev_macos_optional: []

  # GUI applications (macOS)
  gui_apps_macos:
    - firefox
    - onlyoffice
    - transmission
    - visual-studio-code
    - vlc
    - whatsapp

  # Opt-in only: installed with `-e all=true`. Not used day-to-day.
  gui_apps_macos_optional:
    - digikam
    - gitkraken
    - sublime-text
    - zoom

  # Utility applications (macOS)
  utility_apps_macos:
    - alfred
    - alt-tab
    - appcleaner
    # replaces copyclip, which is paid after its trial
    - maccy
    - mos
    - pearcleaner
    - rectangle

  # Opt-in only: installed with `-e all=true`. Not used day-to-day.
  utility_apps_macos_optional: []

  # Nerd Fonts (cross-platform)
  nerd_fonts:
    - name: Hack
      filename: Hack.tar.xz
    - name: Fira Mono
      filename: FiraMono.tar.xz
    - name: Fira Code
      filename: FiraCode.tar.xz

  # Additional fonts
  additional_fonts:
    debian:
      - fonts-roboto
    macos:
      - font-roboto
