---
# Development tools and containerization
- name: Install Docker
  ansible.builtin.include_tasks:
    file: "{{ ansible_facts['os_family'] | lower }}/docker.yaml"
    apply:
      tags: [docker]
  when: (docker | default(false) | bool) or (all | bool)
  tags: [always]

- name: Install DDEV local development environment
  ansible.builtin.include_tasks:
    file: shared/ddev.yaml
    apply:
      tags: [ddev]
  when: (ddev | default(false) | bool) or (all | bool)
  tags: [always]

- name: Install fonts
  ansible.builtin.include_tasks:
    file: "{{ ansible_facts['os_family'] | lower }}/fonts.yaml"
    apply:
      tags: [fonts]
  when: (fonts | bool) or (gui | bool) or (all | bool)
  tags: [always]

- name: Install VPN software
  ansible.builtin.include_tasks:
    file: "{{ ansible_facts['os_family'] | lower }}/vpn.yaml"
    apply:
      tags: [vpn]
  when: (vpn | bool) or (all | bool)
  tags: [always]

- name: Configure Claude Code
  ansible.builtin.include_tasks:
    file: shared/claude_code.yaml
    apply:
      tags: [claude]
  tags: [always]

- name: List installed uv tools
  ansible.builtin.command: uv tool list
  become: true
  become_user: "{{ username }}"
  environment:
    PATH: "{{ homebrew_path }}:{{ local_bin }}:{{ ansible_env.PATH }}"
  register: uv_tool_list
  changed_when: false
  failed_when: false

- name: Install uv tools
  ansible.builtin.command: uv tool install {{ item }}
  become: true
  become_user: "{{ username }}"
  environment:
    PATH: "{{ homebrew_path }}:{{ local_bin }}:{{ ansible_env.PATH }}"
  loop: "{{ tool_sets.uv_tools | reject('in', uv_tool_list.stdout) | list }}"
  register: uv_tool_install
  changed_when: uv_tool_install.rc == 0
  failed_when: false
