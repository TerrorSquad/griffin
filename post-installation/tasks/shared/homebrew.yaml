---
# Bootstrap + update/upgrade are the same on both platforms. Only the
# linuxbrew directory pre-create is Debian-specific, and macOS runs the
# brew module as the invoking user rather than via become.
- name: Check if Homebrew is already installed
  ansible.builtin.stat:
    path: "{{ homebrew_path }}/brew"
  register: homebrew_exists

- name: Pre-create Homebrew directory with correct permissions
  ansible.builtin.file:
    path: /home/linuxbrew
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: '0755'
    recurse: true
  become: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - not homebrew_exists.stat.exists

- name: Install homebrew
  ansible.builtin.shell:
    cmd: NONINTERACTIVE=1 {{ bash_executable }} -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
    executable: "{{ bash_executable }}"
  become_user: "{{ username }}"
  become: true
  register: homebrew_install
  until: homebrew_install is success
  retries: 3
  delay: 5
  changed_when: homebrew_install.rc == 0
  when: not homebrew_exists.stat.exists

- name: Update Homebrew
  community.general.homebrew:
    update_homebrew: true
    path: "{{ homebrew_path }}"
  become: "{{ ansible_facts['os_family'] == 'Debian' }}"
  become_user: "{{ username }}"
  register: brew_update_result
  until: brew_update_result is success
  retries: 3
  delay: 5

- name: Upgrade all Homebrew packages
  community.general.homebrew:
    upgrade_all: true
    path: "{{ homebrew_path }}"
  become: "{{ ansible_facts['os_family'] == 'Debian' }}"
  become_user: "{{ username }}"
  register: brew_upgrade_result
  until: brew_upgrade_result is success
  retries: 3
  delay: 5
