---
- name: Install zsh (Linux)
  ansible.builtin.apt:
    name: zsh
  register: apt_zsh_result
  until: apt_zsh_result is success
  retries: 3
  delay: 2
  when: ansible_facts['os_family'] == 'Debian'

- name: Install zsh (macOS)
  community.general.homebrew:
    name: zsh
    state: present
    path: "{{ homebrew_path }}"
  register: brew_zsh_result
  until: brew_zsh_result is success
  retries: 3
  delay: 2
  become: false
  when: ansible_facts['os_family'] == 'Darwin'

- name: Save ZSH install location into a variable
  ansible.builtin.command: which zsh
  register: zsh_install_path
  changed_when: false
  failed_when: false

- name: Set fallback ZSH path if which command failed
  ansible.builtin.set_fact:
    zsh_path: "{{ zsh_install_path.stdout if zsh_install_path.rc == 0 and zsh_install_path.stdout else zsh_executable }}"

- name: Set ZSH as default login shell for current user
  ansible.builtin.user:
    name: "{{ username }}"
    shell: "{{ zsh_path }}"
  register: shell_change_result
  failed_when: false
  ignore_errors: true

- name: Validate ZSH installation path
  ansible.builtin.debug:
    msg: "Using ZSH path: {{ zsh_path }}"

- name: Log shell change succeeded
  ansible.builtin.debug:
    msg: "✅ Shell change succeeded - ZSH is now the default shell"
  when: shell_change_result.changed
  # noqa: no-handler

- name: Log shell change failed or skipped
  ansible.builtin.debug:
    msg: "ℹ️  Shell change failed or skipped - this is normal in CI environments or if ZSH is already the default"
  when: not shell_change_result.changed

# .zshrc is overwritten wholesale below, so anything the user appended by hand
# has to be rescued into ~/.zshrc.local first. One-time: once .zshrc.local
# exists, `creates` skips this and edits go straight into that file.
- name: Preserve hand-added .zshrc lines into ~/.zshrc.local
  ansible.builtin.script:
    cmd: >-
      {{ role_path }}/files/extract_zshrc_local.py
      {{ zshrc }} {{ role_path }}/defaults/.zshrc {{ zshrc }}.local
    executable: "{{ ansible_python_interpreter | default('/usr/bin/env python3') }}"
    creates: "{{ zshrc }}.local"
  become_user: "{{ username }}"
  become: true

- name: Initialize .zshrc
  ansible.builtin.copy:
    src: "{{ role_path }}/defaults/.zshrc"
    dest: "{{ zshrc }}"
    mode: "0644"
    backup: true
  become_user: "{{ username }}"
  become: true

- name: Create ~/.zsh/aliases directory
  ansible.builtin.file:
    path: "{{ user_home }}/.zsh/aliases"
    state: directory
    mode: "0755"
  become_user: "{{ username }}"
  become: true

- name: Copy aliases files to ~/.zsh/aliases
  ansible.builtin.copy:
    src: ./defaults/.zsh/aliases
    dest: "{{ user_home }}/.zsh"
    mode: "0644"
  become_user: "{{ username }}"
  become: true

- name: Create functions directory
  ansible.builtin.file:
    path: "{{ user_home }}/.zsh/functions"
    state: directory
    mode: "0755"
  become_user: "{{ username }}"
  become: true

- name: Copy functions files to ~/.zsh/functions
  ansible.builtin.copy:
    src: "./defaults/.zsh/functions"
    dest: "{{ user_home }}/.zsh"
    mode: "0644"
    force: true
  become_user: "{{ username }}"
  become: true

- name: Create ~/.zsh/completions directory
  ansible.builtin.file:
    path: "{{ user_home }}/.zsh/completions"
    state: directory
    mode: "0755"
  become_user: "{{ username }}"
  become: true

- name: Copy completions files to ~/.zsh/completions
  ansible.builtin.copy:
    src: "./defaults/.zsh/completions"
    dest: "{{ user_home }}/.zsh"
    mode: "0644"
  become_user: "{{ username }}"
  become: true

- name: Create ~/.zsh/config directory
  ansible.builtin.file:
    path: "{{ user_home }}/.zsh/config"
    state: directory
    mode: "0755"
  become_user: "{{ username }}"
  become: true

- name: Copy config files to ~/.zsh/config
  ansible.builtin.copy:
    src: "./defaults/.zsh/config"
    dest: "{{ user_home }}/.zsh"
    mode: "0644"
  become_user: "{{ username }}"
  become: true

- name: Copy .p10k.zsh
  ansible.builtin.copy:
    src: "{{ role_path }}/defaults/.p10k.zsh"
    dest: "{{ user_home }}/.p10k.zsh"
    mode: "0644"
  become_user: "{{ username }}"
  become: true

- name: Install antidote via Homebrew (ZSH plugin manager)
  community.general.homebrew:
    name: antidote
    state: present
    path: "{{ homebrew_path }}"
  register: brew_antidote_result
  until: brew_antidote_result is success
  retries: 3
  delay: 2
  become: "{{ ansible_facts['os_family'] == 'Debian' }}"
  become_user: "{{ username }}"

- name: Configure antidote
  block:
    - name: Copy .zsh_plugins.sh
      ansible.builtin.copy:
        src: "{{ role_path }}/defaults/.zsh_plugins.sh"
        dest: "{{ user_home }}/.zsh_plugins.sh"
        mode: "0644"
      become_user: "{{ username }}"
      become: true
      register: copy_zsh_plugins_sh

    - name: Check if .zsh_plugins.zsh exists
      ansible.builtin.stat:
        path: "{{ user_home }}/.zsh_plugins.zsh"
      become_user: "{{ username }}"
      become: true
      register: zsh_plugins_zsh_stat

    - name: Generate static plugins file
      ansible.builtin.shell: |
        source "{{ homebrew_path | dirname }}/opt/antidote/share/antidote/antidote.zsh"
        antidote bundle <"{{ user_home }}/.zsh_plugins.sh" >"{{ user_home }}/.zsh_plugins.zsh"
      args:
        executable: "{{ zsh_executable }}"
      become_user: "{{ username }}"
      become: true
      register: antidote_bundle
      changed_when: true
      when: copy_zsh_plugins_sh.changed or not zsh_plugins_zsh_stat.stat.exists
  rescue:
    - name: Warn about Antidote failure
      ansible.builtin.debug:
        msg: "⚠️ Failed to configure Antidote or download bundles. Zsh plugins might not be available."
