---
# Programming language environments
- name: Install Rust
  ansible.builtin.include_tasks:
    file: shared/rust.yaml
    apply:
      tags: [rust]
  when: (rust | bool) or (all | bool) or (ci | bool)
  tags: [always]

- name: Install Go
  ansible.builtin.include_tasks:
    file: shared/golang.yaml
    apply:
      tags: [golang]
  when: (golang | bool) or (all | bool) or (ci | bool)
  tags: [always]
