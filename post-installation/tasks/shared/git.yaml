---
- name: Install git (Linux)
  ansible.builtin.apt:
    name:
      - git
  register: apt_git_result
  until: apt_git_result is success
  retries: 3
  delay: 2
  when: ansible_facts['os_family'] == 'Debian'

- name: Install git (macOS)
  community.general.homebrew:
    name: git
    state: present
    path: "{{ homebrew_path }}"
  register: brew_git_result
  until: brew_git_result is success
  retries: 3
  delay: 2
  become: false
  when: ansible_facts['os_family'] == 'Darwin'

- name: Save current git name
  community.general.git_config_info:
    name: "user.name"
    scope: global
  become_user: "{{ username }}"
  become: true
  register: current_git_name
  ignore_errors: true

- name: Save current git email
  community.general.git_config_info:
    name: "user.email"
    scope: global
  become_user: "{{ username }}"
  become: true
  register: current_git_email
  ignore_errors: true

- name: Copy .gitconfig file
  ansible.builtin.copy:
    src: "{{ role_path }}/defaults/.gitconfig"
    dest: "~"
    mode: "0644"
  become_user: "{{ username }}"
  become: true

# Restore git user data since copying the .gitconfig above will overwrite it
- name: Revert git user data
  block:
    - name: Revert old git user name
      community.general.git_config:
        name: "user.name"
        value: "{{ current_git_name.config_value }}"
        scope: global
      become_user: "{{ username }}"
      become: true
      when:
        - current_git_name.config_value is defined
        - current_git_name.config_value != ""
        - current_git_name.config_value != None

    - name: Revert old git user email
      community.general.git_config:
        name: "user.email"
        value: "{{ current_git_email.config_value }}"
        scope: global
      become_user: "{{ username }}"
      become: true
      when:
        - current_git_email.config_value is defined
        - current_git_email.config_value != ""
        - current_git_email.config_value != None

- name: Configure git user name
  when: git_user_name is defined
  community.general.git_config:
    name: "user.name"
    value: "{{ git_user_name }}"
    scope: global
    state: present
  become_user: "{{ username }}"
  become: true

- name: Configure git user email
  when: git_user_email is defined
  community.general.git_config:
    name: "user.email"
    value: "{{ git_user_email }}"
    scope: global
    state: present
  become_user: "{{ username }}"
  become: true
