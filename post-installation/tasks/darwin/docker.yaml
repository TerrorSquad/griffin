---
# ponytail: OrbStack only - Docker Desktop also claims the docker socket, installing both is a coin flip
- name: Check if OrbStack is already installed
  ansible.builtin.stat:
    path: /Applications/OrbStack.app
  register: orbstack_app

# Unconditional rather than gated on /Applications/Docker.app: a deleted app can
# leave the cask receipt behind, and `state: absent` is idempotent either way.
# Only the cask's `uninstall` stanza runs (privileged helpers, ~/.docker/bin) - images,
# volumes and Docker.raw sit behind `zap`, which is deliberately not invoked, so
# OrbStack can still import them.
- name: Remove Docker Desktop (conflicts with OrbStack over the docker socket)
  community.general.homebrew_cask:
    name: docker-desktop
    state: absent
    path: "{{ homebrew_path }}"
  register: docker_desktop_removed
  failed_when: false

- name: Check for a Docker Desktop install Homebrew does not own
  ansible.builtin.stat:
    path: /Applications/Docker.app
  register: docker_desktop_app

- name: Warn about a leftover Docker Desktop app
  ansible.builtin.debug:
    msg: >-
      /Applications/Docker.app is still present after the cask removal, so it was
      installed by hand. Drag it to the Trash or it will fight OrbStack for the docker
      socket. Image and volume data in ~/.docker is untouched either way.
  when: docker_desktop_app.stat.exists

- name: Install OrbStack via Homebrew Cask
  community.general.homebrew_cask:
    name: orbstack
    state: present
    path: "{{ homebrew_path }}"
  when: not orbstack_app.stat.exists
  register: orbstack_install_result
  until: orbstack_install_result is success
  retries: 3
  delay: 2

- name: Log OrbStack installation status
  ansible.builtin.debug:
    msg: >
      OrbStack {{ 'already installed' if orbstack_app.stat.exists else
         ('installed successfully' if orbstack_install_result.changed else
          'installation skipped or failed') }}

- name: Ensure download directory exists
  ansible.builtin.file:
    path: "{{ download_dir }}"
    state: directory
    mode: "0755"

- name: Install docker-compose (Cross-platform)
  ansible.builtin.include_tasks: shared/utils/install_github_asset.yaml
  vars:
    github_repo: docker/compose
    github_asset: docker-compose
    type: binary
    excluded_os_filter: "sha256sum"
    architecture_filter: "{{ docker_compose_arch_fallback }}"
